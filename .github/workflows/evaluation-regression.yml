name: Synthetic evaluation regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-approval:
    name: Local approval app — virtual authenticator only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build --silent
      - run: npm ci --ignore-scripts --prefix apps/local-approval
      - run: npm test --prefix apps/local-approval
      - name: Disposable Chromium software-authenticator test
        working-directory: apps/local-approval
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Retain synthetic screen images only
        uses: actions/upload-artifact@v4
        with:
          name: local-approval-synthetic-screens
          path: apps/local-approval/test-results/**/*.png
          if-no-files-found: error
      - run: echo 'Virtual authenticator only. Real human/device enrollment, organisational authority, external custody and independent review are unproven. Production NO-GO.'

  regression:
    name: Regression only — not security clearance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retain actual compatibility runtime
        run: echo "ATG_NODE20_PATH=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:plugin
      - name: Synthetic multi-agent authority and shared-budget adversarial tests
        run: npm run test:delegated-budget
      - run: npm run test:delegated-custody
      - name: Retained checkpoint and rollback counterexample tests — research only
        run: npm run test:antirollback-anchor
      - name: Checkpoint controller and retained bypass counterexample — research only
        run: node --test experiments/mandatory-destination/anchored-destination.test.mjs
      - run: npm run demo:delegated-custody
      - name: Seven-step synthetic delegated-budget buyer walkthrough
        run: npm run demo:delegated-budget
      - name: State the evidence boundary
        run: |
          echo 'Passing tests include expected reproduction of two successful common-owner attacks.'
          echo 'Independent custody, payment-rail integration and external assessment remain unproven. Production NO-GO.'

  custody-isolation:
    name: Linux distinct-principal custody — synthetic only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build --silent
      - name: Run distinct numeric UIDs on this disposable runner
        run: sudo -- "$(command -v node)" scripts/test-custody-isolation.mjs --output "$RUNNER_TEMP/atg-custody-isolation.json" --disposable-host
      - name: Retain sanitized evidence only
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/atg-custody-isolation.json"; then
            sudo cat "$RUNNER_TEMP/atg-custody-isolation.json"
          fi
          echo 'No private fixture directory or key is uploaded. Administrator/whole-host rollback remains outside this proof. Production NO-GO.'
